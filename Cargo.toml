[package]
name = "fastfind"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A fast, observable filename indexer for Linux filesystems"
license = "MIT"

[dependencies]
anyhow = "=1.0.86"
clap = { version = "=4.5.4", features = ["derive"] }
rusqlite = { version = "=0.31.0", features = ["bundled"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
walkdir = "=2.5.0"

[dev-dependencies]
tempfile = "=3.10.1"
